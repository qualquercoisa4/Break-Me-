<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0b1018" />
<title>Break-Me — Prototype</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1018;touch-action:none}
canvas{display:block;width:100%;height:100%;outline:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#f3f6fb}
.topbar{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;display:flex;gap:10px;align-items:center}
.logo{font-size:14px;font-weight:900;letter-spacing:.15em;background:#101722d9;border:1px solid #ffffff1b;border-radius:12px;padding:11px 13px;box-shadow:0 8px 30px #0004}
.status{font-size:12px;color:#aab8cb;background:#101722b8;border:1px solid #ffffff12;border-radius:12px;padding:11px 12px}
.help{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;max-width:250px;text-align:right;font-size:12px;line-height:1.6;color:#c1ccda;background:#101722b8;border:1px solid #ffffff12;border-radius:12px;padding:10px 13px}
.center{position:absolute;left:50%;top:50%;width:6px;height:6px;transform:translate(-50%,-50%);border:1px solid #ffffffdd;border-radius:50%;box-shadow:0 0 0 3px #1115}
.bottom{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#aab8cb;background:#101722b8;border:1px solid #ffffff12;border-radius:99px;padding:9px 13px;white-space:nowrap}
#mobile{display:none;position:fixed;inset:0;pointer-events:none}
#stickArea{position:absolute;left:20px;bottom:max(24px,env(safe-area-inset-bottom));width:130px;height:130px;border:1px solid #ffffff36;border-radius:50%;background:#111a2780;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:48px;height:48px;transform:translate(-50%,-50%);border:1px solid #ffffff80;border-radius:50%;background:#dbeafe38;box-shadow:0 4px 18px #0004}
#lookArea{position:absolute;right:0;top:15%;width:57%;height:66%;pointer-events:auto;touch-action:none}
.mobileBtn{position:absolute;pointer-events:auto;touch-action:none;border:1px solid #ffffff45;background:#111a27d9;color:white;border-radius:50%;font-weight:800;display:grid;place-items:center;box-shadow:0 8px 24px #0004}
#jump{right:25px;bottom:max(35px,env(safe-area-inset-bottom));width:72px;height:72px;font-size:12px}
#zoomIn{right:32px;bottom:max(125px,calc(env(safe-area-inset-bottom) + 125px));width:43px;height:43px;font-size:24px}
#zoomOut{right:82px;bottom:max(125px,calc(env(safe-area-inset-bottom) + 125px));width:43px;height:43px;font-size:24px}
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:#111a27ee;color:#dce7f6;border:1px solid #ffffff20;border-radius:10px;padding:10px 14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
@media(max-width:760px),(pointer:coarse){.help{display:none}#mobile{display:block}.bottom{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 5px);left:50%;font-size:9px}.status{display:none}.topbar{left:12px}.logo{padding:10px;font-size:12px}}
</style>
</head>
<body>
<div id="hud">
  <div class="topbar"><div class="logo">BREAK<span style="color:#75e0c1">—</span>ME</div><div class="status" id="mode">FIRST PERSON · READY</div></div>
  <div class="help">WASD mover · Mouse olhar<br>Scroll do mouse: alternar câmera<br>Espaço: pular · Clique: capturar mouse</div>
  <div class="center" id="crosshair"></div>
  <div class="bottom" id="hint">Clique na tela para jogar</div>
</div>
<div id="mobile">
  <div id="stickArea"><div id="stick"></div></div>
  <div id="lookArea"></div>
  <button class="mobileBtn" id="jump">PULAR</button>
  <button class="mobileBtn" id="zoomIn" aria-label="Aproximar câmera">+</button>
  <button class="mobileBtn" id="zoomOut" aria-label="Afastar câmera">−</button>
</div>
<div id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9db7c7);
scene.fog = new THREE.Fog(0x9db7c7, 35, 100);
const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 180);
const renderer = new THREE.WebGLRenderer({antialias: true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe8f5ff, 0x596477, 2.0));
const sun = new THREE.DirectionalLight(0xfff2d8, 2.6);
sun.position.set(-12,22,10); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;
scene.add(sun);

const mat = (color, roughness=.8) => new THREE.MeshStandardMaterial({color,roughness});
const blockMaterials = [mat(0x8897a9),mat(0x7d8b9a),mat(0xa2afbc),mat(0x69798b),mat(0x95a3b0)];
const floorMat = mat(0x202b38);
const grid = new THREE.GridHelper(100,100,0x6e879a,0x3b4d5d); grid.position.y=-.015; scene.add(grid);
const floor = new THREE.Mesh(new THREE.BoxGeometry(100,.5,100),floorMat);
floor.position.set(0,-.28,0);floor.receiveShadow=true;scene.add(floor);

const blockGeo = new THREE.BoxGeometry(1,1,1);
const blocks=[];
function addBlock(x,y,z,material=blockMaterials[Math.floor(Math.random()*blockMaterials.length)]) {
  const mesh=new THREE.Mesh(blockGeo,material);
  mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;
  mesh.userData.block=true;scene.add(mesh);blocks.push(mesh);return mesh;
}
// Compact, clearly readable platform built from individual blocks.
for(let x=-6;x<=6;x++) for(let z=-5;z<=5;z++) addBlock(x,.25,z,blockMaterials[(x*x+z*z+50)%blockMaterials.length]);
for(let x=-3;x<=3;x++){addBlock(x,1.25,-5);addBlock(x,1.25,5)}
for(let z=-4;z<=4;z++){addBlock(-6,1.25,z);addBlock(6,1.25,z)}
// A few low stacks make the first area feel like a simple test sandbox.
for(const [x,z,h] of [[-3,-2,2],[3,-1,3],[-2,3,2],[3,3,1]]) for(let y=1;y<=h;y++) addBlock(x,y+.75,z);

const player={pos:new THREE.Vector3(0,2.4,2),vel:new THREE.Vector3(),radius:.28,height:1.72,onGround:false};
let yaw=0,pitch=0,cameraDistance=0,desiredDistance=0,thirdPerson=false;
const keys=new Set();
let pointerLocked=false;
const isTouch=()=>matchMedia('(pointer:coarse)').matches || innerWidth<760;
const modeEl=document.querySelector('#mode'),hintEl=document.querySelector('#hint'),crosshair=document.querySelector('#crosshair');
const toastEl=document.querySelector('#toast');
let toastTimer;
function toast(s){toastEl.textContent=s;toastEl.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.style.opacity='0',1500)}
function updateMode(){
 modeEl.textContent=thirdPerson?'THIRD PERSON · ZOOM':'FIRST PERSON · READY';
 crosshair.style.display=thirdPerson?'none':'block';
 hintEl.textContent=isTouch()?'Joystick mover · Arraste para olhar · + / − câmera':'WASD mover · Espaço pular · Scroll: câmera';
}
function setDistance(d){desiredDistance=THREE.MathUtils.clamp(d,0,8);thirdPerson=desiredDistance>.15;updateMode()}
renderer.domElement.addEventListener('click',()=>{if(!isTouch()&&!pointerLocked)renderer.domElement.requestPointerLock?.()});
document.addEventListener('pointerlockchange',()=>{pointerLocked=document.pointerLockElement===renderer.domElement;if(pointerLocked)hintEl.textContent='WASD mover · Espaço pular · Scroll: câmera';else updateMode()});
document.addEventListener('mousemove',e=>{if(pointerLocked){yaw-=e.movementX*.0022;pitch-=e.movementY*.0022;pitch=THREE.MathUtils.clamp(pitch,-1.45,1.45)}});
document.addEventListener('wheel',e=>{if(isTouch())return;setDistance(desiredDistance+(e.deltaY>0?.8:-.8))},{passive:true});
document.addEventListener('keydown',e=>{keys.add(e.code);if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Space')jump()});
document.addEventListener('keyup',e=>keys.delete(e.code));

function jump(){if(player.onGround){player.vel.y=7.2;player.onGround=false}}
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.querySelector('#zoomIn').addEventListener('pointerdown',e=>{e.preventDefault();setDistance(desiredDistance+.9)});
document.querySelector('#zoomOut').addEventListener('pointerdown',e=>{e.preventDefault();setDistance(desiredDistance-.9)});

// Touch joystick and right-side look zone.
const stickArea=document.querySelector('#stickArea'),stick=document.querySelector('#stick'),lookArea=document.querySelector('#lookArea');
let stickId=null,stickX=0,stickY=0,lookId=null,lastLookX=0,lastLookY=0;
stickArea.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stickArea.setPointerCapture(e.pointerId);moveStick(e)});
stickArea.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});
function moveStick(e){const r=stickArea.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=42,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}stickX=dx/max;stickY=dy/max;stick.style.left=`calc(50% + ${dx}px)`;stick.style.top=`calc(50% + ${dy}px)`}
function endStick(e){if(e.pointerId!==stickId)return;stickId=null;stickX=stickY=0;stick.style.left='50%';stick.style.top='50%'}
stickArea.addEventListener('pointerup',endStick);stickArea.addEventListener('pointercancel',endStick);
lookArea.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastLookX=e.clientX;lastLookY=e.clientY;lookArea.setPointerCapture(e.pointerId)});
lookArea.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;const dx=e.clientX-lastLookX,dy=e.clientY-lastLookY;lastLookX=e.clientX;lastLookY=e.clientY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch-dy*.006,-1.35,1.35)});
function endLook(e){if(e.pointerId===lookId)lookId=null}
lookArea.addEventListener('pointerup',endLook);lookArea.addEventListener('pointercancel',endLook);

const vForward=new THREE.Vector3(),vRight=new THREE.Vector3(),move=new THREE.Vector3();
const playerBox=new THREE.Box3(),blockBox=new THREE.Box3();
function collidesAt(pos){
 const minX=pos.x-player.radius,maxX=pos.x+player.radius,minY=pos.y-player.height/2,maxY=pos.y+player.height/2,minZ=pos.z-player.radius,maxZ=pos.z+player.radius;
 if(minY<0.0)return true;
 for(const b of blocks){const p=b.position;if(Math.abs(p.x-(minX+maxX)/2)>.78||Math.abs(p.z-(minZ+maxZ)/2)>.78||p.y+.5<minY||p.y-.5>maxY)continue;
 if(maxX>p.x-.5&&minX<p.x+.5&&maxY>p.y-.5&&minY<p.y+.5&&maxZ>p.z-.5&&minZ<p.z+.5)return true}
 return false;
}
function physics(dt){
 const speed=5.5;
 move.set(0,0,0);
 const forwardInput=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-stickY;
 const sideInput=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+stickX;
 vForward.set(-Math.sin(yaw),0,-Math.cos(yaw));vRight.set(Math.cos(yaw),0,-Math.sin(yaw));
 move.addScaledVector(vForward,forwardInput).addScaledVector(vRight,sideInput);
 if(move.lengthSq()>1)move.normalize();
 const oldX=player.pos.x,oldZ=player.pos.z;
 player.pos.x+=move.x*speed*dt;if(collidesAt(player.pos))player.pos.x=oldX;
 player.pos.z+=move.z*speed*dt;if(collidesAt(player.pos))player.pos.z=oldZ;
 player.vel.y-=19*dt;
 const oldY=player.pos.y;player.pos.y+=player.vel.y*dt;player.onGround=false;
 if(player.pos.y-player.height/2<0){player.pos.y=player.height/2;player.vel.y=0;player.onGround=true}
 // Land on the top surface of platform blocks; side collisions are handled on X/Z.
 if(player.vel.y<=0){for(const b of blocks){const p=b.position;const feet=player.pos.y-player.height/2;if(Math.abs(player.pos.x-p.x)<.78&&Math.abs(player.pos.z-p.z)<.78&&oldY-player.height/2>=p.y+.48&&feet<=p.y+.5){player.pos.y=p.y+.5+player.height/2;player.vel.y=0;player.onGround=true}}}
 if(player.pos.y < -15){player.pos.set(0,3,2);player.vel.set(0,0,0);toast('Você caiu — voltou ao início')}
}
function cameraUpdate(dt){
 const target=new THREE.Vector3(player.pos.x,player.pos.y+.48,player.pos.z);
 cameraDistance=THREE.MathUtils.damp(cameraDistance,desiredDistance,10,dt);
 const lookDir=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));
 if(cameraDistance<.12){camera.position.copy(target);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}
 else {const desired=target.clone().addScaledVector(lookDir,-cameraDistance);camera.position.lerp(desired,1-Math.exp(-12*dt));camera.lookAt(target.clone().addScaledVector(lookDir,2))}
}
let last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;physics(dt);cameraUpdate(dt);renderer.render(scene,camera)}
requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));updateMode()});
updateMode();
</script>
</body>
</html>
