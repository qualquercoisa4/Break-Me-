function endToolHold(){attackHeld=false;toolActive=false;chargeCancelled=false;chargeRing.classList.remove('visible','ready');chargeProgress.style.strokeDashoffset='138.23'}

let audioCtx=null;function soundMiss(){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.setValueAtTime(145,t);o.frequency.exponentialRampToValueAtTime(78,t+.055);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.035,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.07);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.08)}catch(e){}}function soundHit(strong=false){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();osc.type='triangle';osc.frequency.setValueAtTime(strong?190:260,t);osc.frequency.exponentialRampToValueAtTime(65,t+.085);filter.type='lowpass';filter.frequency.value=1200;gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(strong?.18:.11,t+.006);gain.gain.exponentialRampToValueAtTime(.0001,t+.12);osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.13);const n=Math.floor(audioCtx.sampleRate*.075),buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate),data=buf.getChannelData(0);for(let i=0;i<n;i++)data[i]=(Math.random()*2-1)*(1-i/n);const src=audioCtx.createBufferSource(),ng=audioCtx.createGain();src.buffer=buf;ng.gain.setValueAtTime(.0001,t);ng.gain.exponentialRampToValueAtTime(strong?.13:.075,t+.004);ng.gain.exponentialRampToValueAtTime(.0001,t+.075);src.connect(ng);ng.connect(audioCtx.destination);src.start(t);}catch(e){}}
function smashBlock(){if(pickaxeTimer>0||menuMode)return;pickaxeTimer=PICKAXE_COOLDOWN;attackSwing=1;raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hits=raycaster.intersectObjects(blocks,false);if(!hits.length){soundMiss();return}const b=hits[0].object;if(!b.userData.isBlock){soundMiss();return}const index=blocks.indexOf(b);if(index<0)return;blocks.splice(index,1);scene.remove(b);const pos=b.position.clone();for(let i=0;i<12;i++){const piece=new THREE.Mesh(cubeGeo,b.material);piece.position.copy(pos).add(new THREE.Vector3((Math.random()-.5)*.48,(Math.random()-.5)*.48,(Math.random()-.5)*.48));piece.scale.setScalar(.1+Math.random()*.27);piece.castShadow=true;scene.add(piece);const dir=piece.position.clone().sub(camera.position).normalize();dir.add(new THREE.Vector3((Math.random()-.5)*.85,.2+Math.random()*.85,(Math.random()-.5)*.85)).normalize();debris.push({mesh:piece,vel:dir.multiplyScalar(3.2+Math.random()*5.5),life:.55+Math.random()*.45,spin:new THREE.Vector3(Math.random()*22,Math.random()*22,Math.random()*22)})}soundHit(true);const flash=new THREE.PointLight(0xffd17a,2.8,3.5);flash.position.copy(pos);scene.add(flash);setTimeout(()=>scene.remove(flash),65);const nudge=new THREE.Vector3().subVectors(pos,player.pos).normalize();player.vel.addScaledVector(nudge,-.18);camera.position.add(new THREE.Vector3((Math.random()-.5)*.025,(Math.random()-.5)*.025,0))}
function stepPlayer(dt){let fw=(keys.has('KeyW')||keys.has('ArrowUp')?1:0)-(keys.has('KeyS')||keys.has('ArrowDown')?1:0)-sy,sd=(keys.has('KeyD')||keys.has('ArrowRight')?1:0)-(keys.has('KeyA')||keys.has('ArrowLeft')?1:0)+sx;fwd.set(-Math.sin(yaw),0,-Math.cos(yaw));right.set(Math.cos(yaw),0,-Math.sin(yaw));motion.copy(fwd).multiplyScalar(fw).addScaledVector(right,sd);if(motion.lengthSq()>1)motion.normalize();const speed=sprintToggle?8.1:5.3,feet0=player.pos.y-player.height/2;
let nx=player.pos.x+motion.x*speed*dt;if(!solidAt(nx,player.pos.z,feet0,feet0+player.height))player.pos.x=nx;
let nz=player.pos.z+motion.z*speed*dt;if(!solidAt(player.pos.x,nz,feet0,feet0+player.height))player.pos.z=nz;
const oldFeet=player.pos.y-player.height/2;player.vel.y-=19*dt;player.pos.y+=player.vel.y*dt;let feet=player.pos.y-player.height/2;const floorY=floorBelow(player.pos.x,player.pos.z,feet,oldFeet);
if(floorY>0&&player.vel.y<=0){player.pos.y=floorY+player.height/2;player.vel.y=0;player.onGround=true}else if(player.pos.y-player.height/2<0){player.pos.y=player.height/2;player.vel.y=0;player.onGround=true}else player.onGround=false;
if(player.pos.y< -12){player.pos.set(0,2.5,2);player.vel.set(0,0,0);toast('Você caiu. Voltou ao início.')}
}
function updateHero(dt,running){hero.position.set(player.pos.x,player.pos.y-player.height/2,player.pos.z);hero.rotation.y=yaw+Math.PI;const t=performance.now()*.012*(sprintToggle?1.45:1);const swing=running?Math.sin(t)*(sprintToggle?1:.75):0;legL.rotation.x=swing;legR.rotation.x=-swing;armL.rotation.x=-swing*.85;armR.rotation.x=swing*.85;torso.rotation.z=running?Math.sin(t*2)*.035:0;hero.visible=third&&!menuMode;worldPickaxe.rotation.x=-.2+Math.max(0,Math.sin(t))*0.8;viewPickaxe.visible=!third;viewPickaxe.rotation.x=-.25+(attackSwing>0?Math.sin((1-attackSwing)*Math.PI)*1.6:0);}
function updateCamera(dt){const target=new THREE.Vector3(player.pos.x,player.pos.y+.25,player.pos.z);camDist=THREE.MathUtils.damp(camDist,targetDist,10,dt);const dir=new THREE.Vector3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));if(camDist<.12){camera.position.copy(target);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch}else{const shoulder=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const desired=target.clone().addScaledVector(dir,-camDist).addScaledVector(shoulder,.72);camera.position.lerp(desired,1-Math.exp(-12*dt));camera.lookAt(target.clone().addScaledVector(shoulder,.72).addScaledVector(dir,1.5))}}
function menuUpdate(dt){menuClock+=dt;if(menuClock>.32){menuClock=0;menuX+=.8;if(menuX>18)menuX=-18;const p=new THREE.Vector3(menuX,2.5,0);explodeAt(p,1.05);for(let i=0;i<5;i++){const mesh=new THREE.Mesh(cubeGeo,mats[Math.random()*mats.length|0]);mesh.position.set(menuX+(Math.random()-.5)*3,1+Math.random()*5,(Math.random()-.5)*4);mesh.scale.setScalar(.35+Math.random()*.5);scene.add(mesh);debris.push({mesh,vel:new THREE.Vector3((Math.random()-.5)*10,3+Math.random()*8,(Math.random()-.5)*10),life:2.2,spin:new THREE.Vector3(Math.random()*7,Math.random()*7,Math.random()*7)})}hero.visible=true;hero.position.set(menuX,0,0);hero.rotation.y=-Math.PI/2;const t=performance.now()*.015;legL.rotation.x=Math.sin(t)*.9;legR.rotation.x=-Math.sin(t)*.9;armL.rotation.x=-Math.sin(t)*.8;armR.rotation.x=Math.sin(t)*.8;torso.rotation.z=Math.sin(t*2)*.05}camera.position.set(0,9,30);camera.lookAt(0,4,0)}
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.035);last=now;if(menuMode)menuUpdate(dt);else{stepPlayer(dt);updateCamera(dt);updateHero(dt,motion.lengthSq()>.05);pickaxeTimer=Math.max(0,pickaxeTimer-dt);cooldownBar.style.height=((PICKAXE_COOLDOWN-pickaxeTimer)/PICKAXE_COOLDOWN*100)+'%';attackSwing=Math.max(0,attackSwing-dt*5);updateToolCharge(now);if(toolActive&&attackHeld&&pickaxeTimer<=0)smashBlock()}for(let i=debris.length-1;i>=0;i--){const d=debris[i];d.life-=dt;d.vel.y-=12*dt;d.mesh.position.addScaledVector(d.vel,dt);d.mesh.rotation.x+=d.spin.x*dt;d.mesh.rotation.y+=d.spin.y*dt;if(d.mesh.position.y<.15){d.mesh.position.y=.15;d.vel.y*=-.35;d.vel.x*=.78;d.vel.z*=.78}if(d.life<=0){scene.remove(d.mesh);debris.splice(i,1)}}renderer.render(scene,camera)}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});
</script></body></html>
